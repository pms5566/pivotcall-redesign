<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centered Big Hero Text Preview - TradeMastery</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #06100D;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      padding: 30px 20px;
    }
    .preview-title {
      text-align: center;
      font-family: 'Montserrat', sans-serif;
      font-size: 1.8rem;
      color: #6EE7B7;
      margin-bottom: 24px;
    }
    
    .hero-banner-centered-card {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      background: linear-gradient(135deg, #064E3B 0%, #022C22 100%);
      border-radius: 28px;
      padding: 48px 40px 0;
      text-align: center;
      box-shadow: 0 20px 50px rgba(6, 78, 59, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .badge-tag-center {
      display: inline-block;
      background: rgba(110, 231, 183, 0.15);
      border: 1px solid rgba(110, 231, 183, 0.35);
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 800;
      color: #6EE7B7;
      margin-bottom: 20px;
    }

    .hero-title-big {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(2.8rem, 5.2vw, 4.5rem);
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 20px;
      letter-spacing: -1.2px;
      color: #FFFFFF;
      max-width: 900px;
    }

    .highlight-text {
      background: linear-gradient(135deg, #FFFFFF 20%, #6EE7B7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle-big {
      font-size: clamp(1.05rem, 1.6vw, 1.25rem);
      color: #D1FAE5;
      margin-bottom: 32px;
      max-width: 720px;
      line-height: 1.55;
    }

    .hero-subtitle-big strong { color: #FFFFFF; }

    .hero-actions-center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 36px;
      flex-wrap: wrap;
    }

    .btn-pill-big {
      background: linear-gradient(135deg, #FF5722 0%, #F97316 100%);
      color: #FFFFFF;
      padding: 15px 36px;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 800;
      font-size: 1.05rem;
      box-shadow: 0 10px 28px rgba(255, 87, 34, 0.45);
    }

    .btn-secondary-link {
      color: #D1FAE5;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
    }

    .mentor-cutout-centered {
      max-width: 440px;
      width: 100%;
      height: 380px;
      object-fit: contain;
      object-position: bottom center;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.45));
    }
  </style>
</head>
<body>

  <h1 class="preview-title">🎨 Centered Big Hero Text Layout Preview</h1>

  <div class="hero-banner-centered-card">
    
    <span class="badge-tag-center">♾️ Institutional Trading Mastery</span>

    <h1 class="hero-title-big">
      Learn the <span class="highlight-text">Art of Trading</span>
    </h1>

    <p class="hero-subtitle-big">
      Master <strong>SMC & Pivot Strategies</strong> for Intraday precision, alongside <strong>Dow Theory & Wave Methods</strong> for multi-bagger long-term wealth.
    </p>

    <div class="hero-actions-center">
      <a href="#" class="btn-pill-big">Enroll Now →</a>
      <a href="#" class="btn-secondary-link">Read My Journey ↓</a>
    </div>

    <img src="mentor_cutout.png" alt="Mentor Cutout" class="mentor-cutout-centered">

  </div>

</body>
</html>
